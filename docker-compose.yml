services:
  frontend:
    build: .
    ports:
      - "4173:4173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
